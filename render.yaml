# render.yaml — Render free-tier deployment for Artifact
# Two services: agent-system (Python/FastAPI) + web-app (Node/Express)

services:

  # ── Agent System (Python / FastAPI) ──────────────────────────────────────
  - type: web
    name: artifact-agent
    runtime: python
    rootDir: agent-system
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: USE_STUBS
        value: "false"
      - key: GCP_PROJECT_ID
        sync: false          # set in Render dashboard
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: NB2_MODEL
        value: gemini-3.1-flash-image
      - key: NBPRO_MODEL
        value: gemini-3-pro-image
      - key: GEMINI_FAST_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_PRO_MODEL
        value: gemini-2.5-pro
      - key: API_BEARER_TOKEN
        sync: false
      - key: DEFAULT_BUDGET_CEILING_USD
        value: "5.0"

  # ── Web App (Node / Express) ──────────────────────────────────────────────
  - type: web
    name: artifact-web
    runtime: node
    rootDir: web-app
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: AGENT_URL
        sync: false          # set to the artifact-agent Render URL after first deploy
      - key: AGENT_TOKEN
        sync: false          # same value as API_BEARER_TOKEN above
